name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:assets
      - run: npm run check:js
      - run: npm run test:ui
      - run: npm run test:ui:min
      - name: PHP syntax and pricing checks
        run: |
          php --version
          for file in nilwears-bulk-manager/*.php tests/*.php; do php -l "$file" || exit 1; done
          php tests/dates.php
          php tests/pricing.php
          php tests/market-unit.php
          php tests/sheet.php
          php tests/updater.php
          NIL_PUBLIC_UPDATES=1 php tests/updater.php
      - run: python3 scripts/build.py
