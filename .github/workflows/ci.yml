name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:ui
      - name: PHP syntax and pricing checks
        run: |
          php --version
          php -l nilwears-bulk-manager/nilwears-bulk-manager.php
          php -l nilwears-bulk-manager/includes-price.php
          php -l tests/integration.php
          php tests/pricing.php
      - run: python3 scripts/build.py
