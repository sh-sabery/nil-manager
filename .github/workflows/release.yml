name: Release plugin
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-sql:
    uses: ./.github/workflows/mysql.yml
    permissions:
      contents: read
  release:
    needs: native-sql
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:descriptions
      - run: npm run check:assets
      - run: npm run check:js
      - run: npm run test:ui
      - run: npm run test:ui:min
      - run: node tests/payment-checkout.cjs
      - run: NIL_MINIFIED=1 node tests/payment-checkout.cjs
      - name: PHP syntax and pricing checks
        run: |
          for file in nil-manager/*.php tests/*.php scripts/*.php; do php -l "$file" || exit 1; done
          php tests/dates.php
          php tests/pricing.php
          php tests/market-unit.php
          php tests/payments-unit.php
          php tests/sheet.php
          php tests/updater.php
          php tests/distribution.php
          php tests/license.php
          NIL_TEST_LICENSE_CHANNEL=github php tests/license.php
          NIL_PUBLIC_UPDATES=1 php tests/updater.php
          NIL_PUBLIC_UPDATES=1 NIL_TEST_CANONICAL=1 php tests/updater.php
      - run: python3 tests/distribution-build.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhaket-review-only
          path: dist/zhaket-review/*
          retention-days: 30
      - name: Build installation ZIP and release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo 'The pushed tag does not match VERSION.' >&2
            exit 1
          fi
          python3 scripts/build.py --tag "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Publish release with installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its tag and assets unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.manifest.json \
            --target "$GITHUB_SHA" --title "نیل منجر — نسخهٔ ${RELEASE_TAG#v}" --notes-file dist/release-notes.md
