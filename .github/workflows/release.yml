name: Release plugin
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:ui
      - name: PHP syntax and pricing checks
        run: |
          php -l nilwears-bulk-manager/nilwears-bulk-manager.php
          php -l nilwears-bulk-manager/includes-price.php
          php -l tests/integration.php
          php tests/pricing.php
      - name: Build installation ZIP and release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo 'The pushed tag does not match VERSION.' >&2
            exit 1
          fi
          python3 scripts/build.py --tag "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Publish release with installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its tag and assets unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file dist/release-notes.md
